# Prometheus scrape config for this project.
#
# kubernetes_sd_configs automatically discovers pods in the cluster, so
# a newly deployed agent shows up without manually editing this file -
# this is the detail worth calling out in the README as production-style
# service discovery rather than a hardcoded target list.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "agents"
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # Only scrape pods that expose a metrics port (9100/9101/9102)
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: (research-agent|summarizer-agent|code-analysis-agent)
