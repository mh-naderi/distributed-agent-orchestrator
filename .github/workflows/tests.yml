# Continuous integration.
#
# WHAT THIS CAN AND CANNOT TELL YOU. 375 of the 385 tests need no agents, no
# cluster, no GPU and no Ollama - they run anywhere in seconds. The other 10 are
# integration tests that skip when the agent servers are unreachable, which is
# always the case here.
#
# That skip is deliberate, and it has a cost worth stating plainly: those 10
# tests are exactly the ones that once sat out a whole day of local runs while
# two of them were stale and failing. A green tick here means the loop, the
# store, the analyser, the SSE layer and the eval harness are sound. It does
# NOT mean the system works end to end. Only running it does that.
#
# Hence -rs: skipped tests are listed with their reason, so the log says what
# was not covered rather than quietly reporting a smaller number.
#
# The alerts job covers a different gap. tests/test_alert_rules.py checks by
# READING that every alert names a metric this repo declares and is wired into
# the Deployment - which catches the failure mode alerting is worst at, a rule
# that loads healthy and can never fire. What reading cannot decide is whether
# an expression fires at the right moment. promtool evaluates the rules against
# synthetic series and answers that, using the same Prometheus version the
# cluster runs.
#
# The images job covers a gap the tests cannot. tests/test_agent_images.py
# already checks by READING that each Dockerfile copies every module its agent
# imports and that every third-party import is declared - most of the risk, in a
# fifth of a second. What reading cannot see is a build that stops working for a
# reason no source file mentions: a base image that moved, a pip resolution
# failure, a wheel that no longer publishes for python:3.12-slim. Those surface
# by building, or they surface at deploy time.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Both versions run even if one fails - knowing it is version-specific is
      # most of the diagnosis.
      fail-fast: false
      matrix:
        # 3.11 is what the project is developed on; 3.12 is what every agent
        # image actually runs (python:3.12-slim). Testing one would leave the
        # other unverified, and the gap between them is where a version-specific
        # break would hide.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            orchestrator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check for unused imports and undefined names
        # pyflakes rather than a new linter: it is already a dependency, because
        # the code-analysis agent is built on it. The project's own analysis
        # engine checking the project costs nothing extra to install and imposes
        # no style opinions nobody chose.
        run: python -m pyflakes orchestrator agents eval tests

      - name: Run tests
        run: python -m pytest -q -rs

  alerts:
    # Independent of both other jobs, for the same reason images is: a broken
    # alert rule and a broken test are different failures, and chaining them
    # would hide the second behind the first.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what the extractor needs
        # Only the two imports tests/test_alert_rules.py has. The full dev
        # requirements would pull the whole orchestrator stack to read a YAML
        # file.
        run: python -m pip install --quiet pyyaml pytest

      - name: Extract the rules from the ConfigMap
        # The rules ship inside a Kubernetes ConfigMap so `kubectl apply -f
        # k8s/` deploys them with everything else; promtool wants a bare rules
        # file. The extraction lives in the test module rather than here, so
        # there is one definition of where the rules are and not two.
        #
        # Into RUNNER_TEMP, not the checkout: promtool resolves rule_files
        # relative to the working directory, so the rules and the fixture have
        # to sit together, and a generated file in tests/ would be one more
        # thing to gitignore.
        run: |
          python tests/test_alert_rules.py "$RUNNER_TEMP/alerts.yml"
          cp tests/alerts_test.yml "$RUNNER_TEMP/alerts_test.yml"

      - name: Refuse to check nothing
        # promtool reports SUCCESS for an empty test file. That is not
        # hypothetical - the first local run of these tests passed against a
        # fixture that had silently transferred as zero bytes, and proved
        # exactly nothing. A green tick that means "there was nothing to check"
        # is worse than a red one.
        run: |
          test -s "$RUNNER_TEMP/alerts.yml"
          test -s "$RUNNER_TEMP/alerts_test.yml"

      - name: Evaluate the rules with the deployed Prometheus
        # The image is read from k8s/prometheus.yaml rather than pinned here,
        # so CI cannot drift onto a different promtool than the cluster runs.
        run: |
          IMAGE=$(python -c "
          import yaml
          docs = [d for d in yaml.safe_load_all(open('k8s/prometheus.yaml', encoding='utf-8')) if d]
          dep = next(d for d in docs if d['kind'] == 'Deployment')
          print(dep['spec']['template']['spec']['containers'][0]['image'])
          ")
          echo "using $IMAGE"
          docker run --rm -v "$RUNNER_TEMP:/w" -w /w --entrypoint promtool "$IMAGE" \
            check rules alerts.yml
          docker run --rm -v "$RUNNER_TEMP:/w" -w /w --entrypoint promtool "$IMAGE" \
            test rules alerts_test.yml

  images:
    # Deliberately not `needs: test`. A broken Dockerfile and a broken test are
    # independent failures, and chaining them would hide the second until the
    # first was fixed. In parallel they finish at about the same time anyway.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: research-agent
            context: agents/research_agent
            imports: server
          - name: retrieval-agent
            context: agents/retrieval_agent
            imports: server
          - name: code-analysis-agent
            context: agents/code_analysis_agent
            imports: server
          # The odd one out: the agents are self-contained server.py files
          # copied to /app, while this is a package copied to /app/orchestrator,
          # so it is imported by its package path rather than as `server`.
          - name: orchestrator
            context: orchestrator
            imports: orchestrator.api

    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.name }}
        run: docker build -t agent-orchestrator/${{ matrix.name }}:ci ${{ matrix.context }}

      - name: Import what the image is meant to run
        # The build proves pip resolved. This proves the result imports, which
        # is the failure that actually reaches production: a missing COPY or an
        # undeclared dependency builds cleanly and crash-loops on deploy. Unlike
        # the reading-based checks in tests/test_agent_images.py, this runs the
        # real image.
        #
        # Import rather than run: the entrypoint would start a server and block.
        # It is the same module either way, so anything broken at import breaks
        # the container. Importing the orchestrator binds nothing - there is a
        # test for that specifically.
        run: |
          docker run --rm --entrypoint python \
            agent-orchestrator/${{ matrix.name }}:ci \
            -c "import ${{ matrix.imports }}"
