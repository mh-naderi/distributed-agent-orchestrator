[pytest]
testpaths = tests

# asyncio_mode = auto means async test functions and fixtures run without
# needing an @pytest.mark.asyncio decorator on every one of them. Most of this
# codebase is async (MCP calls and LLM calls are both I/O), so the decorators
# would be pure noise.
asyncio_mode = auto

markers =
    integration: needs the three agent servers running (skips automatically if they aren't)
