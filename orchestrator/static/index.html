<!doctype html>
<meta charset="utf-8">
<title>Agent Orchestrator</title>
<style>
  :root { color-scheme: light dark; --line: #8884; }
  body { font: 15px/1.55 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.2rem; margin: 0 0 .25rem; }
  .sub { opacity: .65; font-size: .85rem; margin-bottom: 1.25rem; }
  form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  input { flex: 1; padding: .55rem .7rem; font: inherit; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  button { padding: .55rem 1rem; font: inherit; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: transparent; color: inherit; }
  button[disabled] { opacity: .5; cursor: default; }
  .step { border-left: 3px solid var(--line); padding: .4rem 0 .4rem .8rem; margin: .5rem 0; }
  .step .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
  .step pre { margin: .3rem 0 0; white-space: pre-wrap; word-break: break-word; font-size: .82rem; opacity: .9; }
  .tool_call  { border-color: #d97706; }
  .tool_result{ border-color: #2563eb; }
  .answer     { border-color: #16a34a; }
  .error      { border-color: #dc2626; }
  .truncated  { border-color: #d97706; background: #fffbeb; }
  .queued     { border-color: #64748b; background: #f8fafc; }
  #esc        { font-size: .85rem; opacity: .8; margin-left: .6rem; }
  .busy       { border-color: #dc2626; background: #fef2f2; }
  .answer pre { font-size: .95rem; opacity: 1; }
</style>

<h1>Agent Orchestrator</h1>
<div class="sub">Watch the reason → act → reason loop as it runs.</div>

<form id="f">
  <input id="task" placeholder="Ask something…" value="What is a Kubernetes StatefulSet?" autocomplete="off">
  <button id="go">Run</button>
  <label id="esc" title="Send this run to the Claude API instead of the local model. Costs money; needs ANTHROPIC_API_KEY set on the server.">
    <input type="checkbox" id="escalate"> escalate to Claude
  </label>
</form>

<div id="out"></div>

<script>
  const out = document.getElementById('out');
  const go = document.getElementById('go');
  let source;

  function step(kind, label, body) {
    const el = document.createElement('div');
    el.className = 'step ' + kind;
    el.innerHTML = '<div class="label"></div><pre></pre>';
    el.querySelector('.label').textContent = label;
    el.querySelector('pre').textContent = body;
    out.appendChild(el);
    el.scrollIntoView({ block: 'end', behavior: 'smooth' });
  }

  function finish() {
    if (source) source.close();
    go.disabled = false;
    go.textContent = 'Run';
  }

  document.getElementById('f').onsubmit = (e) => {
    e.preventDefault();
    out.innerHTML = '';
    go.disabled = true;
    go.textContent = 'Running…';

    // Escalation is a deliberate per-request choice, not a heuristic - see
    // get_provider in orchestrator/llm.py for why there is no automatic rule.
    const escalate = document.getElementById('escalate').checked;
    source = new EventSource('/stream?task=' + encodeURIComponent(document.getElementById('task').value)
      + (escalate ? '&escalate=1' : ''));

    source.addEventListener('tools', (e) =>
      step('tools', 'tools discovered', JSON.parse(e.data).tools.join(', ')));

    source.addEventListener('tool_call', (e) => {
      const d = JSON.parse(e.data);
      step('tool_call', `iteration ${d.iteration} · calling ${d.name}`, JSON.stringify(d.arguments));
    });

    source.addEventListener('tool_result', (e) => {
      const d = JSON.parse(e.data);
      step('tool_result', `${d.name} returned`, d.output);
    });

    source.addEventListener('answer', (e) =>
      step('answer', 'answer', JSON.parse(e.data).content));

    // Only one run may touch the GPU at a time, so a second tab waits rather
    // than competing. Announced, because a silent wait looks like a hang.
    source.addEventListener('queued', (e) =>
      step('queued', 'waiting for a slot',
        `another run is in progress — position ${JSON.parse(e.data).ahead} in the queue`));

    source.addEventListener('busy', (e) =>
      step('busy', 'refused', JSON.parse(e.data).message));

    source.addEventListener('truncated', (e) =>
      step('truncated', 'stopped early', JSON.parse(e.data).content));

    source.addEventListener('run_error', (e) =>
      step('error', 'error', JSON.parse(e.data).message));

    source.addEventListener('done', finish);

    // Fires on transport-level failure too, so only report if nothing arrived.
    source.onerror = () => { if (!out.children.length) step('error', 'error', 'connection failed'); finish(); };
  };
</script>
