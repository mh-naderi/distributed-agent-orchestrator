# Cluster topology for kind.
#
# NOT IN k8s/, deliberately. Everything in that directory is applied with a
# single `kubectl apply -f k8s/`, and this file is not a Kubernetes resource -
# it is consumed by the kind CLI before an API server exists. Left in k8s/ it
# makes that command fail with
#     no matches for kind "Cluster" in version "kind.x-k8s.io/v1alpha4"
# after correctly applying everything else, which is a confusing way to end a
# successful deploy.
#
# WHY THIS FILE EXISTS AT ALL. Every Service in this project is ClusterIP,
# which is only reachable from inside the cluster - so reaching anything from
# the host has meant `kubectl port-forward`, one tunnel per service, each
# holding a terminal and dying when its pod is replaced. That is acceptable for
# Grafana, which a human opens occasionally. It is not acceptable for the
# orchestrator UI, whose whole point is to be the front door.
#
# A NodePort alone does not fix it. kind runs the "node" as a Docker container,
# so a NodePort opens a port on THAT container, not on Windows. The port has to
# be published from the node container to the host, and Docker can only publish
# ports when a container is created - which means kind can only honour this at
# CLUSTER CREATION time. Adding it to a running cluster is not possible; the
# cluster has to be deleted and recreated.
#
# Create the cluster with:
#     kind create cluster --name agent-orchestrator --config k8s/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

networking:
  # PINNED, and this is not cosmetic. Left unset, kind asks the OS for an
  # ephemeral port for the API server and bakes it into the container at
  # creation. Windows reserves large TCP blocks and REDRAWS THEM ON BOOT, so a
  # port that was free at creation can become unbindable overnight - and a
  # container port mapping cannot be changed after the fact. The cluster then
  # refuses to start at all:
  #
  #     bind: An attempt was made to access a socket in a way forbidden by
  #     its access permissions
  #
  # That is exactly what happened: kind had picked 4863, which a reboot placed
  # inside the reserved range 4856-4955, and the only way back was to recreate
  # the cluster. Pinning does not make the port immune - nothing is - but it
  # turns a random overnight failure into a known value that can be checked
  # before creation and changed here in one place:
  #
  #     netsh interface ipv4 show excludedportrange protocol=tcp
  apiServerPort: 18443

nodes:
  - role: control-plane
    # ingress-nginx will not schedule without this label, and a label applied
    # with kubectl lives only as long as the node does. Putting it here means a
    # rebuilt cluster is ingress-ready without anyone remembering a manual step
    # - the same reasoning as pinning the ports above.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Node 30080 (the orchestrator Service's nodePort) -> host 18080, the
      # same port the host-process workflow already serves the UI on, so the
      # bookmark does not change between the two ways of running this.
      #
      # hostPort is a real Windows port and therefore subject to the reservation
      # trap documented in docs/RUNBOOK.md. If cluster creation fails to bind
      # it, 18080 has fallen inside a reserved range - check with
      #     netsh interface ipv4 show excludedportrange protocol=tcp
      # and change both this hostPort and the URL you open.
      - containerPort: 30080
        hostPort: 18080
        protocol: TCP
        listenAddress: "127.0.0.1"  # loopback only; do not expose to the LAN
