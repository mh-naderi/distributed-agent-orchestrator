# The retrieval agent is the only STATEFUL service in this system, and that is
# why it's a StatefulSet rather than a Deployment like the other two agents.
#
# A Deployment treats its pods as interchangeable: any pod can be killed and
# replaced by an identical one, because they hold nothing worth keeping. That is
# exactly right for the research and code-analysis agents.
#
# This agent owns a sqlite index that has to outlive the process. A StatefulSet
# gives it what that needs:
#   - a stable pod identity (retrieval-agent-0, not a random hash suffix)
#   - volumeClaimTemplates, so each replica gets its OWN PersistentVolumeClaim,
#     bound to it by name and reattached to the same pod after a restart
#   - ordered, graceful startup and shutdown rather than all-at-once churn
#
# Note replicas: 1, deliberately. Scaling this to 3 would NOT give you three
# workers sharing an index - it would give you three pods each with a separate
# volume and a separate, divergent corpus, so a document indexed via one pod
# would be invisible to queries routed to the others. Sharing one index across
# replicas needs a different design (a real vector database, or read replicas
# over shared storage). That constraint is the thing to understand about stateful
# services, and it's why the stateless agents are the ones that scale freely.

apiVersion: v1
kind: Service
metadata:
  name: retrieval-agent-headless
  labels:
    app: retrieval-agent
spec:
  # clusterIP: None makes this a headless Service: it does no load balancing and
  # instead gives each pod its own DNS record
  # (retrieval-agent-0.retrieval-agent-headless). A StatefulSet requires one -
  # stable identity is meaningless if you can't address a specific pod.
  clusterIP: None
  selector: { app: retrieval-agent }
  ports:
    - name: mcp
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-agent-service
  labels:
    app: retrieval-agent  # lets Prometheus's kubernetes_sd_configs find this
spec:
  # The ordinary Service the orchestrator calls. With one replica it resolves to
  # the single pod; it exists so callers use one stable name and don't have to
  # know about StatefulSet pod naming.
  selector: { app: retrieval-agent }
  ports:
    - name: mcp
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 9101
      targetPort: 9101
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: retrieval-agent
spec:
  serviceName: retrieval-agent-headless  # must match the headless Service above
  replicas: 1
  selector:
    matchLabels: { app: retrieval-agent }
  template:
    metadata:
      labels: { app: retrieval-agent }
      annotations:
        # Discovery is opt-in per pod. Prometheus keeps any pod carrying
        # prometheus.io/scrape=true and scrapes the port named here - so adding
        # a fourth agent means annotating it, not editing Prometheus's config.
        # The previous config filtered on a hardcoded list of agent names,
        # which contradicted the claim that new agents appear automatically.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: retrieval-agent
          image: agent-orchestrator/retrieval-agent:latest
          imagePullPolicy: IfNotPresent  # so kind/minikube uses the locally-built image
          ports:
            # Named on purpose: Prometheus selects the scrape target by port
            # NAME rather than by matching numbers. Its relabel regexes are RE2,
            # which has no backreferences, so "container port == annotated port"
            # cannot be expressed as a pattern - and a name is clearer anyway.
            - name: mcp
              containerPort: 8000
            - name: metrics
              containerPort: 9101
          env:
            # Ollama runs on the host machine, not in the cluster - this is the
            # project's first genuine cross-boundary dependency.
            #
            # host.docker.internal is VERIFIED WORKING from pods on Docker
            # Desktop + kind: Docker Desktop runs a DNS resolver that knows the
            # name, kind's CoreDNS forwards unresolved names to it, and Docker
            # Desktop's network proxy can reach services bound to the host's
            # LOOPBACK interface. That last part matters - Ollama binds
            # 127.0.0.1 by default.
            #
            # It does NOT generalise. On kind over native Linux Docker the name
            # does not exist, and the raw bridge gateway (172.18.0.1) is refused
            # because Ollama is not listening on it. Fixing that means either
            # binding Ollama to 0.0.0.0 (which exposes it to the network) or
            # adding a hostAliases entry pointing at the node gateway.
            #
            # The port is 11434, Ollama's own default, but that is not always
            # bindable here: Windows reserves large TCP blocks and REDRAWS
            # THEM ON BOOT, and 11434 has fallen inside one before
            # (11359-11458), at which point Ollama cannot bind its own port
            # and must be moved:
            #     OLLAMA_HOST=127.0.0.1:11500 ollama serve
            # with this value changed to match. Verified free and serving on
            # 11434 at deploy time. Check the current ranges with:
            #     netsh interface ipv4 show excludedportrange protocol=tcp
            #
            # Getting this wrong fails quietly: the pod starts, the MCP port
            # opens and both probes pass. It only breaks when something asks
            # the agent to embed.
            - name: OLLAMA_HOST
              value: "http://host.docker.internal:11434"
            - name: EMBEDDING_MODEL
              value: "nomic-embed-text"
            - name: RETRIEVAL_DB_PATH
              value: "/data/retrieval.db"
          volumeMounts:
            - name: index
              mountPath: /data
          resources:
            # Limits, not just requests. Without a limit one agent can consume
            # whatever the node has, which on a laptop sharing RAM with Docker's
            # VM and local inference means starving everything else. The
            # retrieval agent gets more headroom because it holds an index and
            # embeds batches; the other two are thin adapters over stubs.
            requests: { memory: "192Mi", cpu: "50m" }
            limits: { memory: "512Mi" }
          livenessProbe:
            # Kubernetes restarts a CRASHED container for free. A HUNG one -
            # still holding its socket, answering nothing - stays Running
            # forever without this. That is the failure this probe exists for,
            # and it is the one actually observed in this project when a
            # dependency wedged.
            tcpSocket:
              port: mcp
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            # Readiness gates TRAFFIC, liveness gates RESTARTS. A pod that is
            # alive but not ready should be left alone, not killed.
            tcpSocket:
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: index
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
