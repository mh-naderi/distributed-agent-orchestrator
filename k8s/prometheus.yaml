# Prometheus, deployed into the cluster so it can use the Kubernetes API for
# service discovery rather than a hardcoded list of targets.
#
# Three things here are worth understanding, because they are the parts that
# fail silently if you get them wrong:
#
# 1. RBAC. kubernetes_sd_configs works by CALLING THE KUBERNETES API to list
#    pods. A pod cannot do that by default - it needs a ServiceAccount bound to
#    a role granting list/watch on pods. Without it, discovery returns 403 and
#    Prometheus sits there with zero targets and no obvious error on the graph.
#
# 2. Port filtering. With role: pod, Prometheus creates ONE TARGET PER DECLARED
#    CONTAINER PORT. Each agent declares two (8000 for MCP, 910x for metrics),
#    so a naive config produces six targets, three of which are permanently red
#    because /metrics on the MCP port is not a thing.
#
# 3. Annotation-driven discovery. Filtering on a hardcoded regex of agent names
#    means editing this file every time an agent is added, which defeats the
#    point of service discovery. Pods opt in with prometheus.io/scrape instead.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  # Read-only, and only what discovery actually needs. Prometheus never writes
  # to the cluster; it only asks "what pods exist and where are they".
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      # How often the alert rules below are evaluated. Left unset this is 1m,
      # which is slower than the 15s scrape and makes a firing alert look
      # laggy for no reason. It is not free - every rule runs every interval -
      # but there are nine of them over a handful of series.
      evaluation_interval: 30s

    # Mounted from the prometheus-rules ConfigMap. A glob rather than a
    # filename so adding a second rules file needs no change here; Prometheus
    # fails to start if a listed file is missing, but an empty glob is fine.
    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: "agents"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Opt in: only pods that asked to be scraped.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"

          # Keep only the port named "metrics". Without this the MCP port
          # (8000) also becomes a target and fails forever, because /metrics on
          # the MCP port is not a thing.
          #
          # This selects by port NAME rather than comparing the container port
          # number to the annotated one. Prometheus relabel regexes are RE2,
          # which has no backreference support, so a pattern meaning "these two
          # numbers are equal" is rejected outright at config load. Naming the
          # port is clearer than any regex trick would have been anyway.
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics

          # Let a pod override the metrics path if it ever needs to.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

          # Readable labels on every series, so Grafana can group by agent
          # rather than by IP address.
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: agent
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
---
# Alert rules.
#
# WHAT THIS DOES AND DOES NOT DO. There is no Alertmanager here. Alertmanager
# exists to ROUTE alerts - to email, Slack, PagerDuty - and this project has
# none of those. Prometheus evaluates these rules and shows what is firing at
# /alerts by itself, which is where they are meant to be read. Nothing here
# pages anyone, and nothing here wakes anybody up. It is the difference between
# "the system can say it is unwell" and "someone will be told", and only the
# first is claimed.
#
# WHERE THE NUMBERS COME FROM. Prometheus keeps 6h of data in an emptyDir, so
# there is no long history to fit thresholds against, and inventing plausible
# percentages would have produced alerts that fire on nothing in particular.
# Every threshold below is instead derived from something already fixed: a
# configured limit, a bound the code enforces, or the stated meaning of the
# counter in orchestrator/metrics.py. Where no such anchor existed, the rule
# asks whether a failure is the MAJORITY of what happened rather than guessing
# at a rate - "most runs are doing this" needs no calibration to be alarming.
#
# The rate() expressions produce no series at all when nothing is running, so
# an idle cluster fires nothing. That is why the ratios need no "and enough
# traffic" guard clause.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
data:
  alerts.yml: |
    groups:
      # ------------------------------------------------------------------
      # Is the system there at all
      # ------------------------------------------------------------------
      - name: availability
        rules:
          - alert: ScrapeTargetDown
            # up == 0 means the pod exists and the metrics port did not
            # answer. A DELETED pod does not appear here at all - its series
            # stop, they do not go to zero - which is what the next rule is
            # for. 2m rather than instant: a rolling update briefly fails a
            # scrape, and that is not worth reporting.
            expr: up{job="agents"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.agent }} is not serving metrics"
              description: "Pod {{ $labels.pod }} is scheduled but its metrics port has not answered for 2 minutes."

          - alert: AllTargetsVanished
            # Every target gone means discovery itself broke - the RBAC was
            # revoked, or the annotation/port-name contract changed - rather
            # than a service being down. Distinct failure, distinct fix.
            # 10m because a cluster restart legitimately empties this.
            expr: absent(up{job="agents"})
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus is scraping nothing"
              description: "No target matched job=agents for 10 minutes. Kubernetes service discovery or the metrics port naming is broken, not a single agent."

      # ------------------------------------------------------------------
      # Is it able to do the work
      # ------------------------------------------------------------------
      - name: capacity
        rules:
          - alert: RunsBeingTurnedAway
            # Threshold is 0 because metrics.py already says what this counter
            # means: "a rising rejection count means the queue cap is being hit
            # and people are being turned away". MAX_QUEUED_RUNS is 4 on top of
            # MAX_CONCURRENT_RUNS of 1, so a rejection is not backpressure
            # working - it is a request refused outright.
            expr: increase(orchestrator_runs_total{outcome="rejected"}[15m]) > 0
            labels:
              severity: warning
            annotations:
              summary: "Requests are being refused"
              description: "{{ $value | printf \"%.0f\" }} run(s) were rejected in the last 15m because the queue was full. Concurrency is capped at 1 with 4 queued by design; sustained rejections mean the cap is too low for the load."

          - alert: DiscoveryReachedNoAgents
            # Also 0, and for a stronger reason. Discovery is best-effort by
            # design: an unreachable agent is logged and the run proceeds with
            # a partial toolset. Reaching NO agent is the one case that
            # tolerance cannot absorb, because the run then has zero tools -
            # which is exactly the answering-from-nothing failure the reground
            # guardrail exists to catch. It should never happen quietly.
            expr: increase(orchestrator_discovery_failures_total[15m]) > 0
            labels:
              severity: critical
            annotations:
              summary: "Orchestrator discovered no agents"
              description: "Discovery reached zero agents in the last 15m. Runs in that state have no tools at all."

          - alert: RunsSlowerThanDesigned
            # 300s is not a guess: it is the last finite bucket of
            # orchestrator_run_duration_seconds, chosen when that histogram was
            # defined as the point past which a run is off the scale the design
            # anticipated. A p95 there means most of the distribution has
            # moved, not that one run was slow. Long window because runs are
            # infrequent and a 5m rate would be mostly noise.
            #
            # >= 300, NOT > 300, and this was written the wrong way first.
            # histogram_quantile cannot return more than the highest finite
            # bucket bound: once the quantile falls in the +Inf bucket it
            # reports that bound and stops. With every run taking an hour this
            # expression still returns exactly 300, so `> 300` was an alert
            # that could never fire under any circumstance. Verified with
            # promtool rather than reasoned about - it returned 3E+02 for a
            # series with all its mass above 300 - and tests/alerts_test.yml
            # now pins that case.
            expr: histogram_quantile(0.95, sum by (le) (rate(orchestrator_run_duration_seconds_bucket[30m]))) >= 300
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Runs are taking longer than the histogram was built for"
              description: "p95 run duration has reached the 300s top bucket, so the real value is 300s or more. Check whether the model was evicted from GPU memory - OLLAMA_KEEP_ALIVE is 2m, and a cold reload costs far more than an inference."

          - alert: RunsStartedWithNoTools
            # Per occurrence, for the same reason as rejections: a run with no
            # tools is never something the user did. It is also the exact
            # answering-from-nothing condition the reground guardrail exists to
            # catch, arriving before the run even starts.
            #
            # This is deliberately on the OUTCOME rather than on
            # orchestrator_discovery_failures_total, because there are two ways
            # to reach no_tools and that counter only sees one of them.
            # Discovery raising increments it; discovery succeeding and
            # returning an empty tool list does not - every agent reachable and
            # advertising nothing looks perfectly healthy to it. That second
            # path had no alert at all until this rule.
            #
            # On the raising path this and DiscoveryReachedNoAgents both fire.
            # That is intentional: one names the cause, the other the effect,
            # and two alerts during a total outage is not the noise worth
            # optimising away.
            expr: increase(orchestrator_runs_total{outcome="no_tools"}[15m]) > 0
            labels:
              severity: critical
            annotations:
              summary: "Runs are starting with no tools"
              description: "A run began with an empty tool list in the last 15m. Either discovery failed, or every agent is reachable and advertising nothing."

          - alert: MostRunsFailing
            # A proportion, NOT a per-occurrence rule, and the difference was
            # measured rather than assumed. `failed` is RunState's pessimistic
            # default: anything that escapes without setting an outcome lands
            # here, and that includes a client disconnecting mid-run, because a
            # generator's finally runs when it is closed. Closing a browser tab
            # during a slow answer therefore records a failure. Verified by
            # doing it - one killed curl, one increment.
            #
            # So `> 0` would alert on somebody navigating away, which is normal
            # use. A majority cannot be explained that way. The observed
            # instance is the model backend going down: Ollama died mid-session
            # on 2026-09-08, every run returned ConnectionError, and nothing
            # fired because no rule referenced this outcome at all.
            expr: >-
              sum(rate(orchestrator_runs_total{outcome="failed"}[30m]))
              / sum(rate(orchestrator_runs_total[30m])) > 0.5
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Most runs are failing outright"
              description: "Over half of recent runs ended in an unhandled failure. Check that the model backend is reachable - OLLAMA_HOST must point at a port Ollama actually bound, and Windows redraws its reserved port ranges on boot."

          - alert: MostRunsTruncated
            # Truncation means the run hit MAX_ITERATIONS, which is the loop
            # guardrail working - so per-occurrence alerting would raise an
            # alarm every time the system correctly refused to spin forever,
            # and the obvious way to silence it would be to raise the cap. Same
            # reasoning as the reground and nudge rules, and the same bound:
            # the ratio cannot exceed 1.
            expr: >-
              sum(rate(orchestrator_runs_total{outcome="truncated"}[30m]))
              / sum(rate(orchestrator_runs_total[30m])) > 0.5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Most runs are hitting the iteration cap"
              description: "Over half of recent runs ran out of iterations instead of answering. The loop is going round without converging; check whether a tool is returning something the model keeps re-querying."

      # ------------------------------------------------------------------
      # Is the one thing that cannot be rebuilt still there
      #
      # Every other failure in this file is recoverable by redeploying. The
      # corpus is not: it lives on a PersistentVolume and there is no source to
      # regenerate it from. It also fails QUIETLY, which is why it needs its own
      # rules rather than relying on the grounding ones. An emptied index makes
      # `retrieve` report no evidence, the model falls back to `search_web`,
      # search succeeds, and answers keep arriving - so no reground fires,
      # because a reground needs EVERY tool to have come back empty. The system
      # looks healthy while its memory is gone.
      # ------------------------------------------------------------------
      - name: data
        rules:
          - alert: CorpusIsEmpty
            # == 0 is safe to alert on because the gauge is not incremental: it
            # is set from store.count() at module load and again after every
            # index, so it carries the true size from the moment the process
            # starts. Zero means the index holds nothing, not that the metric
            # has not been populated yet. Confirmed against the running agent -
            # gauge 401, SELECT COUNT(*) 401.
            #
            # An absent series does not match this, so a pod that is still
            # starting is silent rather than alarming.
            #
            # A FRESH DEPLOY WILL FIRE THIS, and that is left deliberately. A
            # new cluster's corpus really is empty and retrieval really cannot
            # answer from it until something is indexed; the alert is telling
            # the truth. 10m is enough to deploy and seed without seeing it.
            expr: retrieval_documents_total == 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "The retrieval corpus is empty"
              description: "The index holds no documents, so every retrieve returns no evidence and answers will come from web search alone. On a fresh cluster this is expected until the corpus is seeded; otherwise something emptied a volume that has no other copy."

          - alert: CorpusMostlyGone
            # The corpus only grows in normal operation: index_documents adds,
            # and nothing in the serving path deletes. So a decrease is always
            # either a maintenance script, a restore, or data loss - and the
            # first two are rare and deliberate. "More than half of it went" is
            # the same majority reasoning the other proportion rules use, and
            # needs no calibration to be alarming.
            #
            # A DELIBERATE RESTORE TO AN OLDER SNAPSHOT FIRES THIS. That is the
            # intent, not a flaw: replacing 399 documents with 170 is precisely
            # the thing worth noticing if nobody meant to do it. The operator
            # who ran the restore can explain it; nobody can explain the other
            # case after the fact.
            #
            # The baseline is bounded by retention. Prometheus keeps 6h in an
            # emptyDir here, so max_over_time cannot look further back than
            # that, and a Prometheus restart resets what it has seen - a
            # collapse during that gap is compared against the new, lower peak
            # and may not register. The corpus-size panel on the dashboard is
            # the longer memory.
            expr: >-
              retrieval_documents_total
              < 0.5 * max_over_time(retrieval_documents_total[6h])
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "The retrieval corpus lost more than half its documents"
              description: "The index is under half the size it recently was. If this was a restore or a purge, it is expected; if not, the volume has lost data and docs/RUNBOOK.md has the restore procedure."

      # ------------------------------------------------------------------
      # Is what it produces trustworthy
      # ------------------------------------------------------------------
      - name: grounding
        rules:
          - alert: MostRunsAnsweredFromNothing
            # A reground firing is the guardrail WORKING, so alerting on one
            # would punish the fix. What is abnormal is the proportion. The
            # ratio is bounded at 1 because MAX_REGROUNDS is 1 - a run can
            # reground at most once - so > 0.5 reads directly as "most runs
            # tried to answer with every tool empty". No calibration needed for
            # that to be worth looking at.
            expr: >-
              sum(rate(orchestrator_regrounds_total[30m]))
              / sum(rate(orchestrator_runs_total[30m])) > 0.5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Most runs are answering from empty evidence"
              description: "Over half of recent runs called tools, got nothing back, and answered anyway before being sent back. That is the shape of every fabrication this project has recorded - check the corpus and the search path rather than the prompt."

          - alert: MostRunsNarratedToolCalls
            # Same bound and same reasoning: MAX_NUDGES is 1. metrics.py states
            # the intent outright - "a rising line here is evidence that a
            # prompt change made things worse" - so this is that sentence as a
            # rule.
            expr: >-
              sum(rate(orchestrator_nudges_total[30m]))
              / sum(rate(orchestrator_runs_total[30m])) > 0.5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Most runs describe a tool call instead of making one"
              description: "Over half of recent runs had to be re-prompted because the model narrated a tool call. If a prompt or model changed recently, this is the regression."

          - alert: ToolFailingOnMostCalls
            # Per tool, not global: one broken tool among five is invisible in
            # an aggregate. > 0.5 separates broken from flaky - a tool that
            # errors on most calls is not intermittent. Recorded at the MCP
            # boundary, so schema-invalid input counts as an error here, which
            # is deliberate and documented in architecture.md.
            expr: >-
              sum by (tool_name) (rate(tool_calls_total{status="error"}[30m]))
              / sum by (tool_name) (rate(tool_calls_total[30m])) > 0.5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.tool_name }} is failing most calls"
              description: "{{ $labels.tool_name }} returned an error on over half its calls in the last 30m."

          - alert: SearchMostlyRateLimited
            # The one known gap that is still open: ddgs scrapes HTML and
            # throttles. The search path already spaces requests and retries
            # once, so a rate_limited outcome reaching this counter means the
            # retry did not save it. Majority again - occasional throttling is
            # expected and handled, most searches throttled is the tool being
            # effectively unavailable while still reporting success.
            expr: >-
              sum(rate(search_outcomes_total{outcome="rate_limited"}[30m]))
              / sum(rate(search_outcomes_total[30m])) > 0.5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "DuckDuckGo is throttling most searches"
              description: "Over half of recent searches were rate-limited after the built-in retry. Web results are effectively unavailable; answers will lean on the existing corpus without saying so."
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  labels:
    app: prometheus
spec:
  selector: { app: prometheus }
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus  # without this, discovery gets 403
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h  # local dev; no need to keep more
          ports:
            - containerPort: 9090
          resources:
            # Explicit limits because this cluster shares a 16GB laptop with
            # Docker's VM and local LLM inference. An unbounded Prometheus will
            # happily grow into whatever is left.
            requests: { memory: "128Mi", cpu: "50m" }
            limits: { memory: "512Mi" }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              # A separate mount, not a second key in prometheus-config: a
              # ConfigMap mounts as a directory, so mounting the config one at
              # /etc/prometheus already fills that path. The rules need their
              # own subdirectory for the glob above to match.
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          # emptyDir, not a PVC: metrics here are disposable. This is the
          # deliberate contrast with the retrieval agent, whose index is not.
          emptyDir: {}
