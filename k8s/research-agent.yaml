# Deployment: keeps N replicas of the research agent running, restarts
# on crash. Service: gives it a stable name (research-agent-service)
# that the orchestrator can always reach, regardless of pod restarts.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-agent
spec:
  # Two, deliberately. The architecture notes argue that stateless agents can
  # be scaled freely while the retrieval agent cannot, and until now that was
  # asserted in prose with every replicas: 1 in the repo quietly contradicting
  # it. This is the claim made falsifiable.
  #
  # It only works because MCPToolRegistry opens a fresh session per operation
  # rather than holding one connection for the life of the process: each call
  # is a new connection, so kube-proxy is free to place it on either pod. A
  # long-lived shared session would have pinned every call to whichever pod it
  # first connected to, and the second replica would sit idle.
  replicas: 2
  selector:
    matchLabels: { app: research-agent }
  template:
    metadata:
      labels: { app: research-agent }
      annotations:
        # Discovery is opt-in per pod. Prometheus keeps any pod carrying
        # prometheus.io/scrape=true and scrapes the port named here - so adding
        # a fourth agent means annotating it, not editing Prometheus's config.
        # The previous config filtered on a hardcoded list of agent names,
        # which contradicted the claim that new agents appear automatically.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: research-agent
          image: agent-orchestrator/research-agent:latest
          imagePullPolicy: IfNotPresent  # so kind/minikube uses the locally-built image
          env:
            # After a successful search this agent hands its results to the
            # retrieval agent to index - see agents/research_agent/indexer.py
            # for why the side effect lives with the producer of the data
            # rather than in the orchestrator.
            #
            # Best effort: if this address is wrong or the retrieval agent is
            # down, searches still succeed and the failure shows up as
            # search_results_indexed_total{status="skipped"} rather than as a
            # broken tool.
            - name: RETRIEVAL_AGENT_URL
              value: "http://retrieval-agent-service:8000/mcp"
          ports:
            # Named on purpose: Prometheus selects the scrape target by port
            # NAME rather than by matching numbers. Its relabel regexes are RE2,
            # which has no backreferences, so "container port == annotated port"
            # cannot be expressed as a pattern - and a name is clearer anyway.
            - name: mcp
              containerPort: 8000
            - name: metrics
              containerPort: 9100
          resources:
            # Limits, not just requests. Without a limit one agent can consume
            # whatever the node has, which on a laptop sharing RAM with Docker's
            # VM and local inference means starving everything else. The
            # retrieval agent gets more headroom because it holds an index and
            # embeds batches; the other two are thin adapters over stubs.
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "256Mi" }
          livenessProbe:
            # Kubernetes restarts a CRASHED container for free. A HUNG one -
            # still holding its socket, answering nothing - stays Running
            # forever without this. That is the failure this probe exists for,
            # and it is the one actually observed in this project when a
            # dependency wedged.
            tcpSocket:
              port: mcp
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            # Readiness gates TRAFFIC, liveness gates RESTARTS. A pod that is
            # alive but not ready should be left alone, not killed.
            tcpSocket:
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: research-agent-service
  labels:
    app: research-agent  # lets Prometheus's kubernetes_sd_configs find this
spec:
  selector: { app: research-agent }
  ports:
    - name: mcp
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 9100
      targetPort: 9100
